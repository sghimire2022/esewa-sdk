name: Publish to npm

# Triggered by publishing a GitHub Release. Tag the release vX.Y.Z to match
# the version already committed in package.json (bump it yourself first,
# e.g. `npm version patch`, then push and create the release from that tag).
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    # Pauses here until a required reviewer approves in the Actions UI.
    # One-time setup: repo Settings → Environments → New environment →
    # name it "npm-publish" → add required reviewers.
    environment: npm-publish
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted Publishing (OIDC) needs a recent npm CLI; the one bundled
      # with Node 22 is too old to support it yet.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Verify release tag matches package.json version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          TAG_VERSION="${TAG#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Release tag ($TAG) does not match package.json version ($PKG_VERSION)."
            echo "Bump package.json with 'npm version', push, then tag/release from that commit."
            exit 1
          fi

      # typecheck, test and build all run via the package's own
      # "prepublishOnly" script, so a failure here blocks the publish step.
      #
      # No NPM_TOKEN here: this publishes via npm Trusted Publishing (OIDC).
      # npm exchanges this job's GitHub Actions identity token for a short-
      # lived publish credential, so there's no long-lived secret to leak
      # and no "stage-only" token restriction. Requires a one-time trusted
      # publisher registration on npmjs.com (see below).
      - name: Publish
        run: npm publish --provenance
